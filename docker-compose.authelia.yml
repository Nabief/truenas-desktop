# Overlay Authelia — à lancer avec :
#   docker compose -f docker-compose.yml -f docker-compose.authelia.yml up -d
services:
  authelia:
    image: authelia/authelia:4.39
    container_name: truenas-authelia
    restart: unless-stopped
    ports:
      - "9091:9091"           # publié pour que NPM (autre hôte) l'atteigne
    volumes:
      - /mnt/Truenas_Stockage/apps/desktop/authelia:/config
    env_file:
      - /mnt/Truenas_Stockage/apps/desktop/authelia/secrets.env
    environment:
      TZ: "Europe/Paris"
    healthcheck:
      disable: true
