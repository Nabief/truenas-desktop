# ============================================================
#  Overlay Authelia (2FA) — à combiner avec le compose principal :
#     docker compose -f docker-compose.yml -f docker-compose.authelia.yml up -d
#  Les deux fichiers forment UN seul projet -> même réseau Docker,
#  donc le conteneur nginx du bureau joint « authelia » par son nom.
#
#  Adapte le chemin /mnt/Truenas_Stockage/apps/desktop à ton install.
# ============================================================
services:
  authelia:
    image: authelia/authelia:4.39
    container_name: truenas-authelia
    restart: unless-stopped
    # Port NON publié : joignable uniquement par le nginx du bureau (réseau interne).
    expose:
      - "9091"
    volumes:
      - /mnt/Truenas_Stockage/apps/desktop/authelia:/config
    env_file:
      - /mnt/Truenas_Stockage/apps/desktop/authelia/secrets.env
    environment:
      TZ: "Europe/Paris"
    healthcheck:
      disable: true
