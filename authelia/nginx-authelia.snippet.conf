# ============================================================
#  Snippet nginx — activer la 2FA Authelia sur le bureau
#  À intégrer dans le nginx.conf du bureau (voir AUTHELIA.md).
#  Remplace desktop.example.com / auth.example.com par tes domaines.
# ============================================================

# ─────────────────────────────────────────────────────────────
#  1) DANS le server{} du bureau, RETIRE les deux lignes Basic auth :
#         auth_basic           "TrueNAS Desktop";
#         auth_basic_user_file /etc/nginx/.htpasswd;
#     et AJOUTE à la place, au niveau server{} :
# ─────────────────────────────────────────────────────────────

    # Résolveur DNS interne de Docker (pour joindre « authelia » dynamiquement).
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Délégation d'authentification à Authelia (2FA).
    auth_request /internal/authelia/authz;
    auth_request_set $user  $upstream_http_remote_user;
    auth_request_set $groups $upstream_http_remote_groups;
    auth_request_set $name  $upstream_http_remote_name;
    auth_request_set $email $upstream_http_remote_email;
    # Redirection vers le portail Authelia si non authentifié (méthode moderne :
    # l'URL vient de l'en-tête Location renvoyé par Authelia).
    auth_request_set $redirection_url $upstream_http_location;
    error_page 401 =302 $redirection_url;

    # Emplacement interne qui interroge Authelia.
    location /internal/authelia/authz {
        internal;
        set $authelia http://authelia:9091/api/authz/auth-request;
        proxy_pass $authelia;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URL    $scheme://$host$request_uri;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

# ─────────────────────────────────────────────────────────────
#  2) DANS le server{} du bureau, le bloc « location /s/ { » :
#     remplace la ligne  « auth_basic off; »  par :
# ─────────────────────────────────────────────────────────────
#        auth_request off;

# ─────────────────────────────────────────────────────────────
#  3) AJOUTE un second server{} (à côté du premier) qui sert le
#     portail Authelia sur le sous-domaine auth.* (même port 8099) :
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name auth.example.com;          # ← ton domaine portail

    location / {
        proxy_pass         http://authelia:9091;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}

# ─────────────────────────────────────────────────────────────
#  Note : donne aussi un server_name au bloc bureau (server_name
#  desktop.example.com;) au lieu de « _ », pour que les deux
#  domaines soient bien distingués sur le même port.
# ─────────────────────────────────────────────────────────────
