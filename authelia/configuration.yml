# ============================================================
#  Authelia — 2FA derrière Nginx Proxy Manager (HTTPS)
#  Version cible : 4.39.x
#  Les secrets viennent de authelia/secrets.env (AUTHELIA_*).
#  Remplace goassistance.fr / desktop. / auth. par tes domaines.
# ============================================================
theme: 'dark'
log:
  level: 'info'
server:
  address: 'tcp://:9091'
totp:
  issuer: 'TrueNAS Desktop'
  period: 30
authentication_backend:
  file:
    path: '/config/users_database.yml'
access_control:
  default_policy: 'deny'
  rules:
    - domain: 'desktop.goassistance.fr'
      policy: 'two_factor'
session:
  cookies:
    - name: 'authelia_session'
      domain: 'goassistance.fr'
      authelia_url: 'https://auth.goassistance.fr'
      default_redirection_url: 'https://desktop.goassistance.fr'
      expiration: '1h'
      inactivity: '15m'
storage:
  local:
    path: '/config/db.sqlite3'
notifier:
  filesystem:
    filename: '/config/notification.txt'
