# ============================================================
#  nginx.conf du bureau — SANS auth locale.
#  L'accès est protégé EN AMONT par NPM + Authelia (2FA).
#  ⚠ L'accès direct à 192.168.1.10:8099 contourne Authelia :
#     à restreindre par pare-feu (voir guide) une fois la 2FA en place.
# ============================================================
server {
    listen 80;
    server_name _;

    # File Station : uploads volumineux
    client_max_body_size 20g;
    client_body_timeout 3600s;
    root /usr/share/nginx/html;
    index index.html;
    # ── Barrière d'authentification devant tout le bureau ────────────
    # Login exigé avant d'accéder à la page (qui contient le token) et aux
    # endpoints fileops / terminal / VNC. /s/ (partages publics) est exempté.
    # 2FA : déléguer à un portail (Authelia / authentik) via auth_request.

    location / {
        try_files $uri /index.html;
    }

    location = /api/current {
        proxy_pass            https://192.168.1.10/api/current;
        proxy_http_version    1.1;
        proxy_set_header      Upgrade           WebSocket;
        proxy_set_header      Connection        "Upgrade";
        proxy_set_header      Host              nas.exemple.fr;
        proxy_ssl_verify      off;
        proxy_ssl_server_name off;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
    }

    location /api/ {
        proxy_pass          https://192.168.1.10/api/;
        proxy_http_version  1.1;
        proxy_ssl_verify    off;
        proxy_ssl_server_name off;
        proxy_set_header    Host              nas.exemple.fr;
        proxy_set_header    Authorization     $http_authorization;
        proxy_pass_header   Authorization;
        proxy_set_header    Cookie            $http_cookie;
        proxy_pass_header   Set-Cookie;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    location /_download/ {
        proxy_pass            https://192.168.1.10/_download/;
        proxy_http_version    1.1;
        proxy_ssl_verify      off;
        proxy_ssl_server_name off;
        proxy_set_header      Host nas.exemple.fr;
        proxy_read_timeout    120s;
    }

    # Liens de partage publics (sans token) — landing page + téléchargement/zip
    location /s/ {
        proxy_pass            http://fileops:8765/s/;
        proxy_http_version    1.1;
        proxy_set_header      Host $host;
        proxy_buffering       off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 30s;
    }

    location /fileops/ {
        proxy_pass         http://fileops:8765/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 30s;
    }

    location /truenas-shell {
        proxy_pass         http://fileops:8766;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /vnc-proxy {
        proxy_pass         http://fileops:8766;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /vnc-viewer {
        alias /usr/share/nginx/html/vnc-viewer.html;
        default_type text/html;
        add_header Cache-Control "no-cache";
    }

    location /websocket {
        proxy_pass            https://192.168.1.10/websocket;
        proxy_http_version    1.1;
        proxy_set_header      Upgrade           $http_upgrade;
        proxy_set_header      Connection        "upgrade";
        proxy_set_header      Host              nas.exemple.fr;
        proxy_set_header      Authorization     $http_authorization;
        proxy_pass_header     Authorization;
        proxy_ssl_verify      off;
        proxy_ssl_server_name off;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
    }
}